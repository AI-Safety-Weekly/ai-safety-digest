site_name: AI Safety Weekly
site_description: Weekly auto-generated reading list of new AI safety research
site_url: https://ai-safety-weekly.github.io/ai-safety-digest/

theme:
  name: material
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.tabs
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/ai-safety-weekly/ai-safety-digest

nav:
  - This week: index.md
  - Archive: archive.md
  - About: about.md

# Weekly digest pages are linked from the landing page, not in the nav.
not_in_nav: |
  digest-*.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-safety-weekly/ai-safety-digest

hooks:
  - docs/_hooks/editorial.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/editorial-forest.css

extra_javascript:
  - javascripts/feedback-gate.js
  - javascripts/editorial-filter.js

exclude_docs: |
  _hooks/
