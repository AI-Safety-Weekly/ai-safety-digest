name: Dot migration PR contracts
on:
  pull_request:
    paths:
      - 'src/safety_digest/**'
      - 'scripts/dot_*.py'
      - 'tests/**'
      - '.github/workflows/dot-*.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies without inference credentials
        run: pip install pytest arxiv requests beautifulsoup4 feedparser pyyaml python-dateutil mkdocs-material anthropic
      - name: Run regression and isolated publication tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
