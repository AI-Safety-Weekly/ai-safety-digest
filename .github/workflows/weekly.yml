name: Weekly digest

on:
  schedule:
    # 09:00 America/New_York on Monday (13:00 UTC during EST, 14:00 UTC EDT).
    # Cron is UTC; pick one — 13:00 = 9am ET in winter, 8am ET in summer.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        required: false
        default: "7"
      max_papers:
        description: "Cap papers classified (leave blank = no cap). Useful for cheap test runs."
        required: false
        default: ""
      build_only:
        description: "Skip pipeline + commit, only rebuild and deploy the site from existing docs/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit the regenerated docs/
  pages: write      # deploy via Pages Actions
  id-token: write   # ditto (OIDC)

# Don't run a second weekly job (or manual trigger) while one is still going
# — they'd race on the git push.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Cap worst-case runtime. Normal run is <10 min; full arXiv 429-retry
    # backoff plus classification can stretch to ~70 min.
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run digest pipeline
        if: ${{ github.event.inputs.build_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          MAX_PAPERS: ${{ github.event.inputs.max_papers || '' }}
        run: |
          ARGS="--days ${DAYS} --config-dir config --out-dir docs"
          if [ -n "${MAX_PAPERS}" ]; then
            ARGS="${ARGS} --max-papers ${MAX_PAPERS}"
          fi
          echo "Running: safety-digest ${ARGS}"
          safety-digest ${ARGS}

      - name: Commit updated digest markdown
        id: commit
        if: ${{ github.event.inputs.build_only != 'true' }}
        run: |
          set -e
          git config user.name  "ai-safety-digest-bot"
          git config user.email "ai-safety-digest-bot@users.noreply.github.com"
          git add docs/
          [ -f state.db ] && git add state.db || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Weekly digest: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site (mkdocs)
        run: |
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
