# Lab safety blogs / system cards / risk reports to poll weekly.
#
# Two strategies:
#   rss     — parse RSS/Atom feed at `feed_url`.
#   sitemap — pull `sitemap_url`, filter by `url_prefix` + lastmod, fetch
#             each surviving page for title + description meta tags.
#
# filter:
#   loose  — keep everything in the date window (use for sources that are
#            almost entirely safety-relevant — METR, Apollo, Anthropic).
#   strict — also require a hit on the built-in safety keyword list. Use
#            for sources that mix capability/product news (OpenAI, DeepMind).
#
# auto_admit:
#   true  — set matched_auto_admit on each item (classifier defaults to high)
#   false — set matched_review instead (classifier judges normally)

sources:
  - name: openai
    label: "OpenAI"
    strategy: rss
    feed_url: "https://openai.com/news/rss.xml"
    filter: strict
    auto_admit: false

  - name: deepmind
    label: "DeepMind"
    strategy: rss
    feed_url: "https://deepmind.google/blog/rss.xml"
    filter: strict
    auto_admit: false

  - name: metr
    label: "METR"
    strategy: rss
    feed_url: "https://metr.org/feed.xml"
    filter: loose
    auto_admit: true

  - name: apollo
    label: "Apollo Research"
    strategy: sitemap_index
    sitemap_url: "https://www.apolloresearch.ai/sitemap_index.xml"
    # Yoast-style WP install. /blog (general), /science (technical research),
    # /governance (policy work) — all directly safety-relevant. Skip /page,
    # /products, /member_group, /job_category, /research_category, etc.
    sub_sitemap_pattern: "(post|science|governance)-sitemap\\.xml$"
    filter: loose
    auto_admit: true

  - name: anthropic
    label: "Anthropic"
    strategy: sitemap
    sitemap_url: "https://www.anthropic.com/sitemap.xml"
    url_prefix: "https://www.anthropic.com/news/"
    # /news/ also covers funding, hiring, office openings, product launches.
    # Strict keeps system cards, RSP updates, eval reports, red-team posts.
    filter: strict
    auto_admit: true

  # AISI is a Webflow site: no RSS, sitemap has no <lastmod>, post pages strip
  # article:published_time. Their /blog index page DOES render dates inline
  # per card, so we scrape that. Limitation: only the ~4 "featured" cards
  # show dates; older cards are dateless and silently skipped. Fine for
  # weekly runs at their publishing pace (~1-2/week).
  - name: uk-aisi
    label: "UK AISI"
    strategy: index_page
    index_url: "https://www.aisi.gov.uk/blog"
    url_prefix: "https://www.aisi.gov.uk/blog/"
    card_class: "card"
    filter: loose
    auto_admit: true

  # CAIS originally pointed at /work/ (a static 6-page hub, not a publishing
  # stream). Their actual time-stamped output lives at /blog/. Webflow site
  # like AISI, but better: every card has a visible date (abbreviated month
  # format, "Sep 15, 2024"). Low cadence (~5-10 posts/year), so this source
  # is often quiet — when it does fire, the post is usually a substantive
  # original CAIS framing (Humanity's Last Exam, policy proposals, threat
  # analyses) rather than newsletter aggregation (covered separately via
  # substack-aisn). Loose filter since everything CAIS posts is on-topic.
  - name: cais
    label: "CAIS"
    strategy: index_page
    index_url: "https://www.safe.ai/blog"
    url_prefix: "https://www.safe.ai/blog/"
    card_class: "blog-card-padding"
    filter: loose
    auto_admit: true

  # TODO: Redwood Research — neither RSS nor sitemap is exposed. Skipping
  # until a feed appears or we add HTML-scraping logic for their blog index.
  - name: redwood
    label: "Redwood Research"
    strategy: rss
    feed_url: ""
    disabled: true
    filter: loose
    auto_admit: true

  # ── Governance / policy sources ────────────────────────────────────
  # Aaron's exact lane (international coordination, verification mechanisms,
  # compute governance) lives disproportionately OFF arXiv — on think-tank
  # and policy publishers. These feed the Zone 1 backbone with primary-source
  # governance work an arXiv-only intake can't reach.

  # GovAI — squarely in-lane (EU GPAI code, dual-use/bio, compute governance).
  # Loose: GovAI's output is on-topic; let GATE 0 + the classifier drop the
  # occasional non-research item (job postings, annual reports) downstream
  # rather than pre-filtering by title keyword and losing real posts.
  - name: govai
    label: "GovAI"
    strategy: rss
    feed_url: "https://www.governance.ai/post/rss.xml"
    filter: loose
    auto_admit: false

  # CSET (Georgetown) — pure governance / compute / semiconductor supply
  # chain, plus their translations of Chinese AI policy. All in-lane → loose.
  - name: cset
    label: "CSET"
    strategy: rss
    feed_url: "https://cset.georgetown.edu/publications/feed/"
    filter: loose
    auto_admit: false

  # RAND — the /pubs/new.xml feed is an ALL-TOPICS firehose (health, housing,
  # defense, education…), so it MUST be strict: the safety-keyword title filter
  # drops the non-AI items, same pattern as OpenAI/DeepMind. RAND's HTML
  # article pages 403 a bot UA — handled by the browser-like USER_AGENT in
  # lab_collector (so the deep-read step can fetch their full text).
  - name: rand
    label: "RAND"
    strategy: rss
    feed_url: "https://www.rand.org/pubs/new.xml"
    filter: strict
    auto_admit: false

  # ── Discussion forums ──────────────────────────────────────────────
  # `source_type: forum` means the byline is a human, not the venue
  # itself. Treated as review_carefully (not auto-admit) since forum
  # posts are discussion/analysis, not vetted research output.

  - name: alignment-forum
    label: "Alignment Forum"
    source_type: forum
    strategy: rss
    feed_url: "https://www.alignmentforum.org/feed.xml"
    # Alignment Forum is already topic-filtered by the community — every
    # post is on-topic for AI safety. No further keyword filtering.
    filter: loose
    auto_admit: false

  - name: lesswrong
    label: "LessWrong"
    source_type: forum
    strategy: rss
    feed_url: "https://www.lesswrong.com/feed.xml"
    # LessWrong is much broader (rationality, life advice, etc.) — require
    # safety keywords in the title to surface only AI-safety discussion.
    filter: strict
    auto_admit: false

  # ── Curated AI-safety newsletters ──────────────────────────────────
  # All loose-filtered because each newsletter is already topic-curated
  # by its author. Surfacing as forum posts since the byline is a person.

  - name: substack-zvi
    label: "Don't Worry About the Vase"
    source_type: forum
    strategy: rss
    feed_url: "https://thezvi.substack.com/feed"
    filter: loose
    auto_admit: false

  - name: substack-import-ai
    label: "Import AI"
    source_type: forum
    strategy: rss
    feed_url: "https://importai.substack.com/feed"
    filter: loose
    auto_admit: false

  - name: substack-aisn
    label: "AI Safety Newsletter"
    source_type: forum
    strategy: rss
    feed_url: "https://newsletter.safe.ai/feed"
    filter: loose
    auto_admit: false
