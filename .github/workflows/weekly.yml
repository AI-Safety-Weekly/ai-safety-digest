name: Weekly digest

on:
  schedule:
    # 09:00 America/New_York on Monday (13:00 UTC during EST, 14:00 UTC EDT).
    # Cron is UTC; pick one — 13:00 = 9am ET in winter, 8am ET in summer.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # to commit the regenerated docs/ site

# Don't run a second weekly job (or manual trigger) while one is still going
# — they'd race on the git push.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Cap worst-case runtime. Normal run is <10 min; full arXiv 429-retry
    # backoff (60s → 5m → 15m → 30m) plus classification can stretch to ~70 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          safety-digest --days 7 --config-dir config --out-dir docs

      - name: Commit updated site
        run: |
          git config user.name  "ai-safety-digest-bot"
          git config user.email "ai-safety-digest-bot@users.noreply.github.com"
          git add docs/ state.db || true
          if ! git diff --cached --quiet; then
            git commit -m "Weekly digest: $(date -u +%Y-%m-%d)"
            git push
          fi

# GitHub Pages serves from /docs on the main branch.
# Enable at: Settings → Pages → Source = Deploy from branch → main /docs
