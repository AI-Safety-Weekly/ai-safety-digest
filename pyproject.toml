[project]
name = "ai-safety-digest"
version = "0.1.0"
description = "Weekly automated digest of new AI safety research"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1.0",
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.9.0",
    "mkdocs-material>=9.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
safety-digest = "safety_digest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
