name: Digest watchdog

# Safety net for the weekly digest's flaky GitHub-scheduled trigger.
#
# GitHub scheduled runs are best-effort and can be silently dropped under load
# (this is exactly what happened on 2026-06-01 — see weekly.yml's cron comment).
# This workflow fires a few times every Sunday at off-peak minutes, checks
# whether the weekly pipeline has actually run/published today, and — only if it
# hasn't — dispatches weekly.yml to recover. Each fire is an independent ~30s
# check, so it just takes ONE of them landing to self-heal. The same dropped-run
# risk applies to this workflow too, which is why it fires multiple times: the
# redundancy is the whole point.

on:
  schedule:
    # Sundays, after the primary 10:17 UTC run would have started (a full
    # pipeline takes ~2h). Three off-peak windows = three independent chances.
    #   11:43 — primary should be mid-run; if it never started, recover early.
    #   13:43 — primary (or an 11:43 recovery) should be finishing/published.
    #   15:43 — last-chance backstop for the day.
    - cron: "43 11 * * 0"
    - cron: "43 13 * * 0"
    - cron: "43 15 * * 0"
  workflow_dispatch: {}

# The built-in GITHUB_TOKEN is enough to dispatch weekly.yml: per GitHub's docs,
# "workflow_dispatch and repository_dispatch events always create workflow runs"
# even when triggered by GITHUB_TOKEN (the recursion-prevention rule that
# suppresses most token-triggered events does NOT apply to these two). So no PAT
# or extra secret is required — we only need actions:write to call dispatch.
permissions:
  contents: read     # read commit history to detect "published today"
  actions: write     # dispatch weekly.yml when recovery is needed

# Don't let two watchdog fires race into a double-dispatch.
concurrency:
  group: digest-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: ${{ vars.DOT_REPLACE_GEMINI != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify publication and bound recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run list --repo "$REPO" --workflow weekly.yml --limit 40 --json status,event,createdAt,displayTitle > "$RUNNER_TEMP/weekly-runs.json"
          DECISION="$(python scripts/publication_receipt.py watchdog --base https://ai-safety-weekly.github.io/ai-safety-digest/ --runs "$RUNNER_TEMP/weekly-runs.json")"
          echo "Publication watchdog: $DECISION" >> "$GITHUB_STEP_SUMMARY"
          case "$DECISION" in
            published) echo "Live edition and coverage bytes verified." ;;
            active) echo "A run is active; no duplicate dispatch." ;;
            exhausted) echo "::error::Publication not verified; automatic pipeline recovery budget exhausted."; exit 1 ;;
            dispatch) gh workflow run weekly.yml --repo "$REPO" --ref main ;;
            *) echo "::error::Unexpected watchdog decision"; exit 1 ;;
          esac
