name: Weekly digest

on:
  schedule:
    # ~10:17 UTC every Monday. Cron is pinned to UTC, so local time shifts with
    # DST: currently 6:17am ET / 3:17am PT (EDT); in winter it's 5:17am ET /
    # 2:17am PT (EST). Note: a full run takes ~2h with thinking on, so the digest
    # is "ready" ~8:17am ET / 5:17am PT — start time, not finish time.
    #
    # Minute is :17, NOT :00 on purpose. GitHub Actions scheduled runs are
    # best-effort and get delayed or dropped under load; the top of the hour
    # is the most congested slot, so round-minute crons are the most likely to
    # be silently skipped. An odd, off-peak minute is materially more reliable.
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        required: false
        default: "7"
      max_papers:
        description: "Cap papers classified (leave blank = no cap). Useful for cheap test runs."
        required: false
        default: ""
      build_only:
        description: "Skip pipeline + commit, only rebuild and deploy the site from existing docs/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit the regenerated docs/
  pages: write      # deploy via Pages Actions
  id-token: write   # ditto (OIDC)

# Don't run a second weekly job (or manual trigger) while one is still going
# — they'd race on the git push.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Cap worst-case runtime. Classification now runs through an 8-worker thread
    # pool (see classifier.py), so a full ~700-paper week is ~35 min — not the
    # old ~2h. The bottleneck is now S2 enrichment, which is serial by design
    # (~1 req/sec polite throttle + 429 backoff). 60 min leaves generous
    # headroom over the ~35 min real runtime for S2/arXiv backoff stacking while
    # still killing a genuinely hung run.
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run digest pipeline
        if: ${{ github.event.inputs.build_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          MAX_PAPERS: ${{ github.event.inputs.max_papers || '' }}
        run: |
          # -v (INFO): surface the funnel volume breakdown + semantic-rescue
          # scores in the run log so the step-2 threshold can be calibrated from
          # real production data, and so the debut of the new pipeline (semantic
          # net, caching, UX overhaul) is observable. Logging-only; reversible.
          ARGS="-v --days ${DAYS} --config-dir config --out-dir docs"
          if [ -n "${MAX_PAPERS}" ]; then
            ARGS="${ARGS} --max-papers ${MAX_PAPERS}"
          fi
          echo "Running: safety-digest ${ARGS}"
          safety-digest ${ARGS}

      - name: Commit updated digest markdown
        id: commit
        if: ${{ github.event.inputs.build_only != 'true' }}
        run: |
          set -e
          git config user.name  "ai-safety-digest-bot"
          git config user.email "ai-safety-digest-bot@users.noreply.github.com"
          git add docs/
          [ -f state.db ] && git add state.db || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Weekly digest: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site (mkdocs)
        run: |
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
