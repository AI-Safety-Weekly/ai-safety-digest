site_name: AI Safety Digest
site_description: Weekly auto-generated reading list of new AI safety research
site_url: https://ai-safety-weekly.github.io/ai-safety-digest/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/ai-safety-weekly/ai-safety-digest

nav:
  - Home: index.md
  - About: about.md

# Weekly digest pages are linked from the landing page, not in the nav.
not_in_nav: |
  digest-*.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-safety-weekly/ai-safety-digest

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/feedback-gate.js
  - javascripts/type-filter.js
