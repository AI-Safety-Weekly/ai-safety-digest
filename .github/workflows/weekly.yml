name: Weekly digest

on:
  schedule:
    # ~10:17 UTC every Sunday. Cron is pinned to UTC, so local time shifts with
    # DST: currently 6:17am ET / 3:17am PT (EDT); in winter it's 5:17am ET /
    # 2:17am PT (EST). Note: a full run takes ~2h with thinking on, so the digest
    # is "ready" ~8:17am ET / 5:17am PT — start time, not finish time.
    #
    # Minute is :17, NOT :00 on purpose. GitHub Actions scheduled runs are
    # best-effort and get delayed or dropped under load; the top of the hour
    # is the most congested slot, so round-minute crons are the most likely to
    # be silently skipped. An odd, off-peak minute is materially more reliable.
    - cron: "17 10 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        required: false
        default: "7"
      max_papers:
        description: "Cap papers classified (leave blank = no cap). Useful for cheap test runs."
        required: false
        default: ""
      build_only:
        description: "Skip pipeline + commit, only rebuild and deploy the site from existing docs/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit the regenerated docs/
  pages: write      # deploy via Pages Actions
  id-token: write   # ditto (OIDC)

# Don't run a second weekly job (or manual trigger) while one is still going
# — they'd race on the git push.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Cap worst-case runtime. Weekly arXiv volume grew from ~550 papers (2026-06)
    # to ~800 (2026-09): the 2026-09-29 manual run was killed at the old 60-min
    # cap ~10 min short of finishing. Budget for the worst path — ~20 min
    # collection (S2 is serial by design: ~1 req/sec polite throttle) + up to
    # 40 min waiting on the Batch API (GEMINI_BATCH_MAX_WAIT below) + a ~40 min
    # synchronous fallback classify + deep-read/briefs — while still killing a
    # genuinely hung run.
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run digest pipeline
        if: ${{ github.event.inputs.build_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          MAX_PAPERS: ${{ github.event.inputs.max_papers || '' }}
          # Cap how long --batch waits before falling back to the synchronous
          # classifier, so batch wait + sync fallback still fits inside
          # timeout-minutes. (The code default is 2h — sized for the 24h batch
          # SLA, not for a CI job.)
          GEMINI_BATCH_MAX_WAIT: "2400"
        run: |
          # -v (INFO): surface the funnel volume breakdown + semantic-rescue
          # scores in the run log (observability + calibration data).
          #
          # --no-semantic: the step-2 semantic net is DISABLED in production. Its
          # first live run (2026-06-08) showed threshold 0.70 rescued 2328/2328
          # rejected papers: gemini-embedding-001 SEMANTIC_SIMILARITY scores sit in
          # a compressed 0.70-0.83 band with ~no discriminative power (the top
          # scorers are off-lane "semantic X" papers), so the net admitted the
          # entire off-lane pool and the pipeline blew past the 60-min timeout.
          # Re-enable ONLY after the net is reworked (mean-centring / different
          # taskType / different approach) and re-calibrated — see PLAN.md step 2.
          # The keyword/author gate is unaffected.
          #
          # --batch: classify Pass 1 via the Gemini Batch API — 50% off every
          # token, verified June 2026 (PLAN.md "Cost reduction") but never
          # wired into this workflow until 2026-09. Falls back to the
          # synchronous path automatically if the batch fails or times out.
          ARGS="-v --no-semantic --batch --days ${DAYS} --config-dir config --out-dir docs"
          if [ -n "${MAX_PAPERS}" ]; then
            ARGS="${ARGS} --max-papers ${MAX_PAPERS}"
          fi
          echo "Running: safety-digest ${ARGS}"
          safety-digest ${ARGS}

      - name: Commit updated digest markdown
        id: commit
        if: ${{ github.event.inputs.build_only != 'true' }}
        run: |
          set -e
          git config user.name  "ai-safety-digest-bot"
          git config user.email "ai-safety-digest-bot@users.noreply.github.com"
          git add docs/
          [ -f state.db ] && git add state.db || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Weekly digest: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site (mkdocs)
        run: |
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
